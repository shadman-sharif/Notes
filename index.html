<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic Notes Library</title>
  <style>
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border: #e2e8f0;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);

      --physics: #0284c7; --physics-bg: #e0f2fe;
      --biology: #16a34a; --biology-bg: #dcfce7;
      --chemistry: #ea580c; --chemistry-bg: #ffedd5;
      --gen-math: #0d9488; --gen-math-bg: #ccfbf1;
      --high-math: #7c3aed; --high-math-bg: #f3e8ff;
    }

    :root[data-theme="dark"] {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --border: #334155;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);

      --physics: #38bdf8; --physics-bg: rgba(2, 132, 199, 0.2);
      --biology: #4ade80; --biology-bg: rgba(22, 163, 74, 0.2);
      --chemistry: #fb923c; --chemistry-bg: rgba(234, 88, 12, 0.2);
      --gen-math: #2dd4bf; --gen-math-bg: rgba(13, 148, 136, 0.2);
      --high-math: #a78bfa; --high-math-bg: rgba(124, 58, 237, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; padding: 1rem; max-width: 1100px; margin: 0 auto; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; gap: 0.5rem; }
    .header-title { font-size: 1.4rem; font-weight: 800; background: linear-gradient(135deg, var(--primary), #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .theme-toggle { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 0.45rem 0.85rem; border-radius: 20px; cursor: pointer; font-size: 0.8rem; font-weight: 600; white-space: nowrap; }

    .controls { display: flex; flex-direction: column; gap: 0.85rem; margin-bottom: 1.5rem; }

    .filters { display: flex; gap: 0.4rem; overflow-x: auto; padding-bottom: 0.3rem; -webkit-overflow-scrolling: touch; }
    .filters::-webkit-scrollbar { display: none; }
    .filter-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 0.45rem 0.85rem; border-radius: 20px; cursor: pointer; font-size: 0.8rem; font-weight: 500; white-space: nowrap; flex-shrink: 0; }
    .filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 700; }

    .search-sort { display: flex; gap: 0.5rem; width: 100%; }
    input, select { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 0.6rem 0.85rem; border-radius: 8px; font-size: 0.88rem; outline: none; }
    #searchInput { flex: 1; min-width: 0; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; flex: 1; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.1rem; display: flex; flex-direction: column; justify-content: space-between; box-shadow: var(--shadow); transition: transform 0.2s ease; }
    .card:hover { transform: translateY(-2px); }
    
    .badge { font-size: 0.68rem; font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 12px; text-transform: uppercase; width: fit-content; margin-bottom: 0.6rem; }
    .badge-physics { color: var(--physics); background: var(--physics-bg); }
    .badge-biology { color: var(--biology); background: var(--biology-bg); }
    .badge-chemistry { color: var(--chemistry); background: var(--chemistry-bg); }
    .badge-general-math { color: var(--gen-math); background: var(--gen-math-bg); }
    .badge-higher-math { color: var(--high-math); background: var(--high-math-bg); }

    .card-title { font-weight: 700; font-size: 1rem; margin-bottom: 0.3rem; line-height: 1.3; }
    .meta { font-size: 0.8rem; color: var(--muted); margin-bottom: 1rem; }

    .open-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 0.65rem; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: background 0.2s; }
    .open-btn:hover { background: var(--primary-hover); }

    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 1rem; z-index: 100; }
    .modal-bg.active { display: flex; }
    .modal { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 1.4rem; width: 100%; max-width: 380px; position: relative; box-shadow: var(--shadow); }
    .modal h3 { margin-bottom: 0.4rem; font-size: 1.15rem; }
    .modal p { font-size: 0.85rem; color: var(--muted); margin-bottom: 1rem; line-height: 1.4; }
    .field { margin-bottom: 0.85rem; text-align: left; }
    .field label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.3rem; }
    .field input { width: 100%; }

    .close-btn { position: absolute; top: 0.8rem; right: 0.8rem; background: none; border: none; color: var(--muted); font-size: 1.2rem; cursor: pointer; padding: 0.2rem; }

    .welcome-banner { background: var(--card-bg); border: 1px solid var(--border); border-left: 4px solid var(--primary); border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 1.2rem; display: none; font-size: 0.85rem; color: var(--text); line-height: 1.4; }

    footer { margin-top: 2.5rem; text-align: center; padding: 1rem; color: var(--muted); font-size: 0.8rem; border-top: 1px solid var(--border); }

    @media(min-width: 768px) {
      body { padding: 1.5rem; }
      .header-title { font-size: 1.7rem; }
      .controls { flex-direction: row; justify-content: space-between; align-items: center; }
      .search-sort { width: auto; }
      .card { padding: 1.4rem; }
      .modal { padding: 1.8rem; }
    }
  </style>
</head>
<body>


  <header>
    <h1 class="header-title">Academic Notes Library</h1>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙 Dark</button>
  </header>

  <div class="welcome-banner" id="welcomeBanner"></div>

  <div class="controls">
    <div class="filters" id="filters"></div>
    <div class="search-sort">
      <input type="text" id="searchInput" placeholder="Search topics..." oninput="render()">
      <select id="sortSelect" onchange="render()">
        <option value="name-asc">A-Z</option>
        <option value="name-desc">Z-A</option>
      </select>
    </div>
  </div>

  <div class="grid" id="grid"></div>


  <div class="modal-bg" id="leadModal">
    <div class="modal">
      <button class="close-btn" onclick="closeModal()">✕</button>
      <h3>Unlock Study Material</h3>
      <p>Confirm your details to instantly view and download this note.</p>
      <form onsubmit="handleFormSubmit(event)">
        <div class="field">
          <label for="userName">Full Name</label>
          <input type="text" id="userName" name="name" required placeholder="e.g. Shadman">
        </div>
        <div class="field">
          <label for="userEmail">Email Address</label>
          <input type="email" id="userEmail" name="email" required placeholder="e.g. shadman@gmail.com">
        </div>
        <button type="submit" class="open-btn" style="margin-top: 0.4rem;" id="submitBtn">Unlock & Open File</button>
      </form>
    </div>
  </div>

  <footer>
    <p>&copy; <span id="year"></span> Academic Notes Library. All rights reserved.</p>
  </footer>

  <script>
   
    const FORMSPREE_ENDPOINT = 'https://formspree.io/f/YOUR_FORM_ID';

    const notes = [
      { id: 1, title: "Classical Mechanics & Dynamics", subject: "physics", fileUrl: "notes/physics_mechanics.pdf", fileSize: "1.2 MB" },
      { id: 2, title: "Cellular Biology & Genetics", subject: "biology", fileUrl: "notes/biology_genetics.pdf", fileSize: "2.4 MB" },
      { id: 3, title: "Organic Chemistry Reactions", subject: "chemistry", fileUrl: "notes/chemistry_organic.pdf", fileSize: "850 KB" },
      { id: 4, title: "Algebra & Polynomial Functions", subject: "general-math", fileUrl: "notes/general_math.pdf", fileSize: "1.1 MB" },
      { id: 5, title: "Differential Calculus", subject: "higher-math", fileUrl: "notes/calculus.pdf", fileSize: "3.0 MB" }
    ];

    let currentSubject = 'all';
    let selectedNote = null;

    function initTheme() {
      const theme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', theme);
      document.getElementById('themeBtn').textContent = theme === 'dark' ? '☀️ Light' : '🌙 Dark';
    }

    function toggleTheme() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const newTheme = isDark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      document.getElementById('themeBtn').textContent = newTheme === 'dark' ? '☀️ Light' : '🌙 Dark';
    }

    function checkUserSession() {
      const savedName = localStorage.getItem('user_name');
      const savedEmail = localStorage.getItem('user_email');
      const banner = document.getElementById('welcomeBanner');

      if (savedName && savedEmail) {
        banner.style.display = 'block';
        banner.innerHTML = `Welcome back, <strong>${savedName}</strong> (${savedEmail}) — Access is unlocked!`;
      }
    }

    function renderFilters() {
      const subjects = ['all', 'physics', 'biology', 'chemistry', 'general-math', 'higher-math'];
      document.getElementById('filters').innerHTML = subjects.map(s => `
        <button class="filter-btn ${currentSubject === s ? 'active' : ''}" onclick="filterSubject('${s}')">
          ${s.replace('-', ' ').toUpperCase()}
        </button>
      `).join('');
    }

    function filterSubject(sub) {
      currentSubject = sub;
      renderFilters();
      render();
    }

    function render() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const sort = document.getElementById('sortSelect').value;

      let list = notes.filter(n => {
        const matchesSub = currentSubject === 'all' || n.subject === currentSubject;
        const matchesQuery = n.title.toLowerCase().includes(query);
        return matchesSub && matchesQuery;
      });

      if (sort === 'name-asc') list.sort((a, b) => a.title.localeCompare(b.title));
      if (sort === 'name-desc') list.sort((a, b) => b.title.localeCompare(a.title));

      document.getElementById('grid').innerHTML = list.map(n => `
        <div class="card">
          <div>
            <div class="badge badge-${n.subject}">${n.subject.replace('-', ' ')}</div>
            <div class="card-title">${n.title}</div>
            <div class="meta">💾 Size: ${n.fileSize}</div>
          </div>
          <button class="open-btn" onclick="openNote(${n.id})">Open File</button>
        </div>
      `).join('');
    }

    function openNote(id) {
      selectedNote = notes.find(n => n.id === id);
      const savedEmail = localStorage.getItem('user_email');

      if (savedEmail) {
        window.open(selectedNote.fileUrl, '_blank');
        render();
      } else {
        document.getElementById('leadModal').classList.add('active');
      }
    }

    function closeModal() {
      document.getElementById('leadModal').classList.remove('active');
    }

    async function handleFormSubmit(event) {
      event.preventDefault();
      const name = document.getElementById('userName').value;
      const email = document.getElementById('userEmail').value;
      const submitBtn = document.getElementById('submitBtn');

      submitBtn.textContent = 'Sending...';
      localStorage.setItem('user_name', name);
      localStorage.setItem('user_email', email);

      const payload = {
        name: name,
        email: email,
        note_requested: selectedNote.title,
        timestamp: new Date().toLocaleString()
      };

      try {
        await fetch(FORMSPREE_ENDPOINT, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify(payload)
        });
      } catch (error) {
        console.log('Saved locally.');
      }

      closeModal();
      submitBtn.textContent = 'Unlock & Open File';
      checkUserSession();
      window.open(selectedNote.fileUrl, '_blank');
      render();
    }

    document.getElementById('year').textContent = new Date().getFullYear();
    initTheme();
    checkUserSession();
    renderFilters();
    render();
  </script>
</body>
</html>
