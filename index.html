<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Notes Hub</title>
  <style>
    /* CSS: Modern Dashboard Design */
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --text-muted: #64748b;
      --primary: #3b82f6;
      --border: #e2e8f0;
      
      /* Subject Colors */
      --physics-color: #0284c7;
      --physics-bg: #e0f2fe;
      --biology-color: #16a34a;
      --biology-bg: #dcfce7;
      --chemistry-color: #ea580c;
      --chemistry-bg: #ffedd5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 2rem 1rem;
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2rem;
      text-align: center;
    }

    header h1 {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
    }

    /* Controls Bar */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    @media (min-width: 640px) {
      .controls {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }

    .subject-filters {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .search-input {
      padding: 0.6rem 1rem;
      border: 1px solid var(--border);
      border-radius: 20px;
      width: 100%;
      max-width: 280px;
      outline: none;
      font-size: 0.95rem;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    /* Document Grid */
    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .note-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .note-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
    }

    .note-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .subject-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.25rem 0.6rem;
      border-radius: 12px;
      text-transform: uppercase;
    }

    .badge-physics {
      color: var(--physics-color);
      background-color: var(--physics-bg);
    }

    .badge-biology {
      color: var(--biology-color);
      background-color: var(--biology-bg);
    }

    .badge-chemistry {
      color: var(--chemistry-color);
      background-color: var(--chemistry-bg);
    }

    .doc-icon {
      width: 24px;
      height: 24px;
      fill: #2b579a; /* Word document blue */
    }

    .note-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .note-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: #f1f5f9;
      color: var(--text-color);
      text-decoration: none;
      padding: 0.6rem;
      border-radius: 8px;
      font-weight: 500;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .download-btn:hover {
      background: var(--border);
    }

    .empty-message {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--text-muted);
      padding: 3rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Academic Notes Library</h1>
    <p>Download and review Word document notes for your subjects</p>
  </header>

  <div class="controls">
    <div class="subject-filters">
      <button class="filter-btn active" onclick="filterSubject('all')">All</button>
      <button class="filter-btn" onclick="filterSubject('physics')">Physics</button>
      <button class="filter-btn" onclick="filterSubject('biology')">Biology</button>
      <button class="filter-btn" onclick="filterSubject('chemistry')">Chemistry</button>
    </div>
    <input type="text" id="searchInput" class="search-input" placeholder="Search notes..." oninput="handleSearch()">
  </div>

  <div class="notes-grid" id="notesGrid">
    <!-- Note cards injected via JS -->
  </div>

  <script>
    // JAVASCRIPT: Data & Filtering Logic

    // 1. Add your Word files (.docx or .doc) here
    const notesData = [
      {
        id: 1,
        title: "Classical Mechanics & Dynamics",
        subject: "physics",
        fileUrl: "notes/physics_mechanics.docx", // Path to your file
        fileSize: "1.2 MB",
        date: "Jul 20, 2026"
      },
      {
        id: 2,
        title: "Cellular Biology & Genetics",
        subject: "biology",
        fileUrl: "notes/biology_genetics.docx",
        fileSize: "2.4 MB",
        date: "Jul 22, 2026"
      },
      {
        id: 3,
        title: "Organic Chemistry Reactions",
        subject: "chemistry",
        fileUrl: "notes/chemistry_organic.docx",
        fileSize: "850 KB",
        date: "Jul 25, 2026"
      },
      {
        id: 4,
        title: "Thermodynamics Summary",
        subject: "physics",
        fileUrl: "notes/physics_thermo.docx",
        fileSize: "1.8 MB",
        date: "Jul 26, 2026"
      }
    ];

    let currentSubject = 'all';
    let searchQuery = '';

    // Render cards to screen
    function renderNotes() {
      const grid = document.getElementById('notesGrid');
      grid.innerHTML = '';

      const filteredNotes = notesData.filter(note => {
        const matchesSubject = currentSubject === 'all' || note.subject === currentSubject;
        const matchesSearch = note.title.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesSubject && matchesSearch;
      });

      if (filteredNotes.length === 0) {
        grid.innerHTML = `<div class="empty-message">No notes found matching your criteria.</div>`;
        return;
      }

      filteredNotes.forEach(note => {
        const card = document.createElement('div');
        card.className = 'note-card';
        
        // Word Document SVG Icon
        const wordIcon = `<svg class="doc-icon" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>`;

        card.innerHTML = `
          <div>
            <div class="note-header">
              <span class="subject-badge badge-${note.subject}">${note.subject}</span>
              ${wordIcon}
            </div>
            <div class="note-title">${note.title}</div>
            <div class="note-meta">Uploaded: ${note.date} • ${note.fileSize}</div>
          </div>
          <a href="${note.fileUrl}" download class="download-btn">
            Download .DOCX
          </a>
        `;
        grid.appendChild(card);
      });
    }

    // Filter handlers
    function filterSubject(subject) {
      currentSubject = subject;
      
      // Update UI buttons
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.textContent.toLowerCase() === subject || (subject === 'all' && btn.textContent === 'All')) {
          btn.classList.add('active');
        }
      });

      renderNotes();
    }

    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value;
      renderNotes();
    }

    // Initial render
    renderNotes();
  </script>
</body>
</html>
